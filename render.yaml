services:
  - type: web
    name: project-cost-control
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: project-cost-control-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.7
databases:
  - name: project-cost-control-db
    databaseName: projectcosts
    user: projectcosts
